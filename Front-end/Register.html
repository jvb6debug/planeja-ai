<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registrar-se</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/registerStyle.css">
    </head>
    <body>
         <header>
            <div>
              <h1><span class="logo"></span>PlanejaAí</h1>
            </div>
            
            <nav>
              <a href="Dashboard.html"><span class="dashboard-icon"></span>Dashboard</a>
                <a href="#"><span class="kanban-icon"></span>Kanban</a>
                <a href="#"><span class="team-icon"></span>Equipes</a>
                <!-- <a href="#"><span class="archives-icon"></span>Arquivos</a> -->
            </nav>
            
            <div>
                <button class="btn login" id="login-btn">Entrar</button>
                <button class="btn register" id="register-btn">Registrar-se</button>
            </div>
        </header>

        <main>
            <section>
                <div class="login-card">
                    <h1>Bem-vindo!</h1>
                    <form method="POST" action="">
                        <label for="Name">Nome: </label>
                        <input type="text" id="Name" placeholder="Nome" required>
                        <label for="email">Email: </label>
                        <input type="email" placeholder="Email" id="Email" required>
                        <label for="Password">Senha: </label>
                        <input type="password" placeholder="Senha" id="Password" required>
                        <button class="sign-in">Entrar</button>
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <div class="logo">
                <span></span>
                <p>PlanejaAí</p>
            </div>
          
            <nav>
              <span class="facebook"></span>
              <span class="linkedin"></span>
              <span class="youtube"></span>
              <span class="instagram"></span>
            </nav>
        </footer>

        <script src="js/register.js"></script>
    </body>
</html>
